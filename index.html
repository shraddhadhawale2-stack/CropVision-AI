<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title<h1>🌾 CropVision AI</h1>/title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8f4;
            color: #1f2937;
        }

        .header {
            background: #176b3a;
            color: white;
            padding: 25px 50px;
        }

        .header h1 {
            font-size: 32px;
        }

        .header p {
            margin-top: 6px;
            opacity: 0.9;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #176b3a;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #176b3a;
        }

        .button-area {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background: #176b3a;
            color: white;
            border: none;
            padding: 14px 45px;
            border-radius: 9px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #12552e;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #e8f5e9;
            border-radius: 12px;
            text-align: center;
        }

        #result h2 {
            color: #176b3a;
        }

        #prediction {
            font-size: 38px;
            font-weight: bold;
            color: #176b3a;
            margin-top: 10px;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

   <div class="header">  
    <h1>🌾 CropVision AI</h1>  
    <p>Smart Crop Yield Prediction using Machine Learning</p>
    <p>Developed by Shraddha Dhawale</p>
    <p>
    </p>
</div>
    <div class="container">

        <div class="card">

            <h2>🌾 Enter Farm Details</h2>

            <form id="predictionForm">

                <div class="grid">

                    <div class="field">
                        <label>Crop Type</label>
                        <input type="text" id="Crop_Type" required>
                    </div>

                    <div class="field">
                        <label>Region</label>
                        <input type="text" id="Region" required>
                    </div>

                    <div class="field">
                        <label>Soil Type</label>
                        <input type="text" id="Soil_Type" required>
                    </div>

                    <div class="field">
                        <label>Season</label>
                        <input type="text" id="Season" required>
                    </div>

                    <div class="field">
                        <label>Farm Area (Hectares)</label>
                        <input type="number" step="any" id="Farm_Area_Hectares" required>
                    </div>

                    <div class="field">
                        <label>Rainfall (mm)</label>
                        <input type="number" step="any" id="Rainfall_mm" required>
                    </div>

                    <div class="field">
                        <label>Temperature (°C)</label>
                        <input type="number" step="any" id="Temperature_C" required>
                    </div>

                    <div class="field">
                        <label>Humidity (%)</label>
                        <input type="number" step="any" id="Humidity_Percent" required>
                    </div>

                    <div class="field">
                        <label>Soil pH</label>
                        <input type="number" step="any" id="Soil_pH" required>
                    </div>

                    <div class="field">
                        <label>Nitrogen (kg/ha)</label>
                        <input type="number" step="any" id="Nitrogen_kg_ha" required>
                    </div>

                    <div class="field">
                        <label>Phosphorus (kg/ha)</label>
                        <input type="number" step="any" id="Phosphorus_kg_ha" required>
                    </div>

                    <div class="field">
                        <label>Potassium (kg/ha)</label>
                        <input type="number" step="any" id="Potassium_kg_ha" required>
                    </div>

                    <div class="field">
                        <label>Fertilizer Used (kg)</label>
                        <input type="number" step="any" id="Fertilizer_Used_kg" required>
                    </div>

                    <div class="field">
                        <label>Pesticide Used (Liters)</label>
                        <input type="number" step="any" id="Pesticide_Used_Liters" required>
                    </div>

                    <div class="field">
                        <label>Irrigation Method</label>
                        <select id="Irrigation_Method" required>
                            <option value="">Select</option>
                            <option value="Drip">Drip</option>
                            <option value="Sprinkler">Sprinkler</option>
                            <option value="Flood">Flood</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Sunshine Hours</label>
                        <input type="number" step="any" id="Sunshine_Hours" required>
                    </div>

                    <div class="field">
                        <label>Organic Farming</label>
                        <select id="Organic_Farming" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                </div>

                <div class="button-area">
                    <button type="submit">
                        🔮 Predict Crop Yield
                    </button>
                </div>

            </form>

            <div id="error"></div>

            <div id="result">
                <h2>🌱 Predicted Crop Yield</h2>
                <div id="prediction"></div>
                <p>Tons per Hectare</p>
            </div>

        </div>

    </div>


    <script>

        document.getElementById("predictionForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const data = {

                    Crop_Type: document.getElementById("Crop_Type").value,
                    Region: document.getElementById("Region").value,
                    Soil_Type: document.getElementById("Soil_Type").value,
                    Season: document.getElementById("Season").value,

                    Farm_Area_Hectares:
                        document.getElementById("Farm_Area_Hectares").value,

                    Rainfall_mm:
                        document.getElementById("Rainfall_mm").value,

                    Temperature_C:
                        document.getElementById("Temperature_C").value,

                    Humidity_Percent:
                        document.getElementById("Humidity_Percent").value,

                    Soil_pH:
                        document.getElementById("Soil_pH").value,

                    Nitrogen_kg_ha:
                        document.getElementById("Nitrogen_kg_ha").value,

                    Phosphorus_kg_ha:
                        document.getElementById("Phosphorus_kg_ha").value,

                    Potassium_kg_ha:
                        document.getElementById("Potassium_kg_ha").value,

                    Fertilizer_Used_kg:
                        document.getElementById("Fertilizer_Used_kg").value,

                    Pesticide_Used_Liters:
                        document.getElementById("Pesticide_Used_Liters").value,

                    Irrigation_Method:
                        document.getElementById("Irrigation_Method").value,

                    Sunshine_Hours:
                        document.getElementById("Sunshine_Hours").value,

                    Organic_Farming:
                        document.getElementById("Organic_Farming").value
                };


                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });


                const result = await response.json();


                if (result.success) {

                    document.getElementById("error").style.display = "none";

                    document.getElementById("result").style.display = "block";

                    document.getElementById("prediction").innerText =
                        result.prediction + " Tons / Hectare";

                } else {

                    document.getElementById("result").style.display = "none";

                    document.getElementById("error").style.display = "block";

                    document.getElementById("error").innerText =
                        result.error;
                }

            }
        );

    </script>

</body>
</html>
