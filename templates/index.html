<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropVision AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f3;
            color: #222;
        }

        .header {
            text-align: center;
            background: #2e7d32;
            color: white;
            padding: 35px 20px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 38px;
        }

        .header p {
            margin: 8px;
            font-size: 17px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .description {
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #256628;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            display: none;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #555;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🌾 CropVision AI</h1>
        <p>Smart Crop Yield Prediction using Machine Learning</p>
        <p>Developed by Shraddha</p>
    </div>

    <div class="container">

        <div class="description">
            <h2>Crop Yield Prediction</h2>
            <p>
                CropVision AI predicts crop yield using agricultural,
                environmental and soil-related parameters.
            </p>
        </div>

        <form id="predictionForm">

            <div class="form-grid">

                <div class="field">
                    <label>Crop Type</label>
                    <input type="text" id="Crop_Type" required>
                </div>

                <div class="field">
                    <label>Region</label>
                    <input type="text" id="Region" required>
                </div>

                <div class="field">
                    <label>Soil Type</label>
                    <input type="text" id="Soil_Type" required>
                </div>

                <div class="field">
                    <label>Season</label>
                    <input type="text" id="Season" required>
                </div>

                <div class="field">
                    <label>Farm Area (Hectares)</label>
                    <input type="number" step="any" id="Farm_Area_Hectares" required>
                </div>

                <div class="field">
                    <label>Rainfall (mm)</label>
                    <input type="number" step="any" id="Rainfall_mm" required>
                </div>

                <div class="field">
                    <label>Temperature (°C)</label>
                    <input type="number" step="any" id="Temperature_C" required>
                </div>

                <div class="field">
                    <label>Humidity (%)</label>
                    <input type="number" step="any" id="Humidity_Percent" required>
                </div>

                <div class="field">
                    <label>Soil pH</label>
                    <input type="number" step="any" id="Soil_pH" required>
                </div>

                <div class="field">
                    <label>Nitrogen (kg/ha)</label>
                    <input type="number" step="any" id="Nitrogen_kg_ha" required>
                </div>

                <div class="field">
                    <label>Phosphorus (kg/ha)</label>
                    <input type="number" step="any" id="Phosphorus_kg_ha" required>
                </div>

                <div class="field">
                    <label>Potassium (kg/ha)</label>
                    <input type="number" step="any" id="Potassium_kg_ha" required>
                </div>

                <div class="field">
                    <label>Fertilizer Used (kg)</label>
                    <input type="number" step="any" id="Fertilizer_Used_kg" required>
                </div>

                <div class="field">
                    <label>Pesticide Used (Liters)</label>
                    <input type="number" step="any" id="Pesticide_Used_Liters" required>
                </div>

                <div class="field">
                    <label>Irrigation Method</label>
                    <select id="Irrigation_Method" required>
                        <option value="">Select</option>
                        <option value="Drip">Drip</option>
                        <option value="Sprinkler">Sprinkler</option>
                        <option value="Flood">Flood</option>
                    </select>
                </div>

                <div class="field">
                    <label>Sunshine Hours</label>
                    <input type="number" step="any" id="Sunshine_Hours" required>
                </div>

                <div class="field">
                    <label>Organic Farming</label>
                    <select id="Organic_Farming" required>
                        <option value="">Select</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

            </div>

            <button type="submit">🌱 Predict Crop Yield</button>

        </form>

        <div id="result"></div>

    </div>

    <div class="footer">
        <p>© 2026 CropVision AI | Developed by Shraddha</p>
    </div>

    <script>
        document.getElementById("predictionForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const data = {
                Crop_Type: document.getElementById("Crop_Type").value,
                Region: document.getElementById("Region").value,
                Soil_Type: document.getElementById("Soil_Type").value,
                Season: document.getElementById("Season").value,
                Farm_Area_Hectares: document.getElementById("Farm_Area_Hectares").value,
                Rainfall_mm: document.getElementById("Rainfall_mm").value,
                Temperature_C: document.getElementById("Temperature_C").value,
                Humidity_Percent: document.getElementById("Humidity_Percent").value,
                Soil_pH: document.getElementById("Soil_pH").value,
                Nitrogen_kg_ha: document.getElementById("Nitrogen_kg_ha").value,
                Phosphorus_kg_ha: document.getElementById("Phosphorus_kg_ha").value,
                Potassium_kg_ha: document.getElementById("Potassium_kg_ha").value,
                Fertilizer_Used_kg: document.getElementById("Fertilizer_Used_kg").value,
                Pesticide_Used_Liters: document.getElementById("Pesticide_Used_Liters").value,
                Irrigation_Method: document.getElementById("Irrigation_Method").value,
                Sunshine_Hours: document.getElementById("Sunshine_Hours").value,
                Organic_Farming: document.getElementById("Organic_Farming").value
            };

            const result = document.getElementById("result");
            result.style.display = "block";
            result.innerHTML = "⏳ Predicting...";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const output = await response.json();

                if (output.success) {
                    result.innerHTML =
                        "🌾 Predicted Crop Yield: " +
                        output.prediction;
                } else {
                    result.innerHTML =
                        "❌ Error: " + output.error;
                }

            } catch (error) {
                result.innerHTML =
                    "❌ Could not connect to the prediction server.";
            }
        });
    </script>

</body>
</html>
